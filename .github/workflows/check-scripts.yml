# Script found in https://github.com/ecooke-macu/homework/actions/runs/42875430622/workflow
name: Check Scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0

      - name: Run script exercise
        shell: bash
        run: bash task-1-script/count-files.sh

      - name: Run configuration exercise
        shell: bash
        run: bash task-2-configuration/check-service.sh